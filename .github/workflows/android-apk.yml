name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "client/**"
      - "scripts/publicar-android.ps1"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build and sync web client
        run: npm run build:android
        working-directory: client
        env:
          VITE_SERVER_URL: http://discord-caseiro.duckdns.org:3001

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/discordia-release.p12"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/discordia-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
        working-directory: client/android

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: discordia-android-release
          path: client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
