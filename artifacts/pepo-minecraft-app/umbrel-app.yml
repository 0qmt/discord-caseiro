name: Minecraft Server
version: "1.1.0"
tagline: Base de Operações para mundos, mods, jogadores e backups
icon: "data:image/svg+xml;base64,"
description: >-
  Uma Base de Operações para Minecraft Java Edition no Umbrel, com loader
  detectado de verdade e evidências claras de compatibilidade:


  - Iniciar / parar / reiniciar o servidor com um clique

  - Console ao vivo + digitar comandos

  - Catálogo de loaders: Vanilla, Paper, Purpur, Fabric, Quilt, Forge e NeoForge

  - Mods e plugins com validação em cinco níveis

  - Mundos: ativar, exportar e proteger com backup

  - Jogadores: whitelist, OP, kick e ban

  - Console ao vivo, RAM, flags da JVM e endereços de conexão

  - Backups online com save-all, save-off e retorno seguro de save-on


  Os amigos entram pelo IP publico da sua casa na porta 25565 (precisa liberar
  essa porta no roteador).
releaseNotes: Nova Base de Operações, suporte correto a Fabric, validação de pacotes e backups.
