manifestVersion: 1
id: pepo-minecraft
category: media
name: Minecraft Server
version: "1.0.0"
tagline: Servidor Paper com painel pra tudo — RAM, plugins, mapas e console
icon: "data:image/svg+xml;base64,"
description: >-
  Um servidor de Minecraft (Java Edition, PaperMC) que roda no seu Umbrel, com um
  painel completo no estilo do umbrelOS:


  - Iniciar / parar / reiniciar o servidor com um clique

  - Console ao vivo + digitar comandos

  - Escolher e trocar a versao do Paper (baixa sozinho)

  - Plugins: buscar no Modrinth, instalar por link ou upload, ativar/desativar

  - Mapas: subir um mundo em .zip, ativar, baixar de volta, excluir

  - server.properties com editor amigavel

  - Quanta RAM o servidor usa (sliders de Xms/Xmx) + flags da JVM

  - Autostart opcional


  Os amigos entram pelo IP publico da sua casa na porta 25565 (precisa liberar
  essa porta no roteador).
releaseNotes: Primeira versao.
