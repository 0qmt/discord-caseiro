<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Atualização disponível</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #262a35, #16171b);
        color: #e6e8ec;
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      .cartao {
        -webkit-app-region: no-drag;
        width: min(460px, 90vw);
        padding: 40px;
        text-align: center;
        background: #24262c;
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
      }
      .icone {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        object-fit: contain;
      }
      h1 { margin: 0 0 8px; font-size: 21px; }
      p.sub { margin: 0 0 28px; color: #969ba5; font-size: 14px; }
      .botoes { display: flex; flex-direction: column; gap: 10px; }
      button {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #reiniciar { background: #5b7cfa; color: #fff; }
      #reiniciar:hover { background: #6d8bff; }
      #reiniciar:disabled { opacity: .6; cursor: not-allowed; }
      #adiar { background: transparent; color: #969ba5; }
      #adiar:hover { color: #e6e8ec; }
    </style>
  </head>
  <body>
    <div class="cartao">
      <img class="icone" src="logo.png" alt="" />
      <h1>Tem atualização nova do discordia</h1>
      <p class="sub" id="versao-texto">Já baixei tudo. É só reiniciar pra entrar na versão nova.</p>
      <div class="botoes">
        <button id="reiniciar">Reiniciar e atualizar</button>
        <button id="adiar">Mais tarde</button>
      </div>
    </div>

    <script>
      (async () => {
        const info = await window.atualizacao.info();
        if (info?.version) {
          document.getElementById('versao-texto').textContent =
            `Versão ${info.version} já baixada. É só reiniciar pra entrar nela.`;
        }
      })();

      document.getElementById('reiniciar').addEventListener('click', (evento) => {
        evento.target.disabled = true;
        evento.target.textContent = 'Reiniciando...';
        window.atualizacao.reiniciar();
      });

      document.getElementById('adiar').addEventListener('click', () => {
        window.atualizacao.adiar();
      });
    </script>
  </body>
</html>
