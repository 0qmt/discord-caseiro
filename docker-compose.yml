# Discord Caseiro rodando no UmbrelOS (substitui o start.sh do Termux) -
# ver docs/superpowers/specs/2026-08-30-migracao-umbrelos-design.md.
services:
  servidor:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - ./data:/app/data
    env_file:
      - ./.env.producao
    environment:
      SHORTCUT_UPSTREAM_HOST: pepo-telegram-downloads_server_1
      SHORTCUT_UPSTREAM_PORT: '8080'
    networks:
      - default
      - umbrel_main_network

  caddy:
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - servidor
    env_file:
      - ./deploy/duckdns/duckdns.env
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config

  turn:
    build:
      context: ./deploy/coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn/entrypoint.sh:/entrypoint-caseiro.sh:ro
    # Sem IP local fixo aqui de propósito - o entrypoint descobre sozinho a
    # cada start (ver entrypoint.sh). Já mudou uma vez depois de um reinício.
    entrypoint: ["sh", "/entrypoint-caseiro.sh"]

  duckdns:
    image: curlimages/curl:8.11.0
    restart: unless-stopped
    user: root
    entrypoint: ["sh", "/vigia.sh"]
    volumes:
      - ./deploy/duckdns/vigia.sh:/vigia.sh:ro
    env_file:
      - ./deploy/duckdns/duckdns.env
    environment:
      DUCKDNS_DOMINIOS: "discord-caseiro"
      DUCKDNS_INTERVALO_SEGUNDOS: "300"

networks:
  umbrel_main_network:
    external: true
