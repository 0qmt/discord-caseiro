# Mesma config que já rodava dentro do proot-distro Alpine no Termux -
# usuário/senha/realm iguais, pra não invalidar nada que já existe. A
# diferença é a faixa de relay explícita (min-port/max-port): antes não
# precisava, porque tudo passava por um túnel só-TCP; agora que a porta é
# encaminhada de verdade no roteador, uma faixa pequena e fixa é mais fácil
# de liberar do que o range gigante default do coturn.
#
# `external-ip`/`relay-ip` NÃO ficam fixos aqui porque o IP público de casa
# muda (é o mesmo motivo do DuckDNS existir) - quem resolve isso é o
# entrypoint.sh, que descobre o IP público atual toda vez que o container
# sobe e passa pro turnserver como argumento de linha de comando.
listening-port=3478
listening-ip=0.0.0.0
min-port=49160
max-port=49200
no-rfc5780
fingerprint
lt-cred-mech
realm=discordcaseiro
user=dcuser:c43cf32f0b10817f4a34b9f2
no-cli
no-tls
no-dtls
no-multicast-peers
